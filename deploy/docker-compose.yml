# Production stack for tgscobackend.qmarkdesk.com.
# CI copies this file to /opt/tgsco-backend on the server for each deploy.
# Application secrets live only in /opt/tgsco-backend/.env on the server.
name: tgsco-backend

services:
  api:
    image: ghcr.io/pmqmark/tgsco_backend:${IMAGE_TAG:-latest}
    container_name: tgsco-backend
    restart: unless-stopped
    # Runs a minimal init as PID 1 so `docker stop` signals reach Node.
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
    # Loopback only: the host's reverse proxy publishes the domain, so this
    # neither exposes the API directly nor competes for ports 80/443.
    ports:
      - '127.0.0.1:5050:5000'
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
