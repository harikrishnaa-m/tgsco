# Host nginx site for the TGSCO API container.
# Install to /etc/nginx/sites-available/ and enable it, then run certbot to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tgscobackend.qmarkdesk.com;

    # Video uploads accept files up to 100 MB.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
